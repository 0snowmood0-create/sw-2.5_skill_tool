<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW2.5 技能與道具速查工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        swGold: '#d97706',
                        swGoldDark: '#b45309',
                        swDarkBg: '#18181b',
                        swCardBg: '#27272a',
                        swBorder: '#3f3f46'
                    },
                    fontFamily: {
                        title: ['Cinzel', 'Noto Sans TC', 'serif'],
                        sans: ['Noto Sans TC', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col bg-zinc-950 text-zinc-100 font-sans">
    <!-- 頁頭 Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-amber-500 text-2xl fa-book-bookmark"></i>
                <h1 class="text-xl md:text-2xl font-bold font-title text-amber-500 tracking-wider">SW2.5 速查對照表</h1> 
            </div>
            
            <!-- 一級主頁籤導覽列 (同一層平鋪) -->
            <nav class="flex gap-2 text-sm md:text-base overflow-x-auto custom-scrollbar pb-1 max-w-full">
                <button id="tab-races" onclick="switchMainTab('races')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-users mr-1"></i>種族
                </button>
                <button id="tab-bards" onclick="switchMainTab('bards')" class="main-tab-btn py-2 px-3 rounded-lg transition-all font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 whitespace-nowrap">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>技能檢索
                </button>
                <button id="tab-items" onclick="switchMainTab('items')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-bag-shopping mr-1"></i>道具檢索
                </button>
                <button id="tab-rules" onclick="switchMainTab('rules')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-scroll mr-1"></i>技能規則
                </button>
                <button id="tab-advanced_combat_rules" onclick="switchMainTab('advanced_combat_rules')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-swords mr-1"></i>上級戰鬥規則
                </button>
                <button id="tab-power_table_rules" onclick="switchMainTab('power_table_rules')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-dice-d6 mr-1"></i>威力表
                </button>
                <button id="tab-other_rules" onclick="switchMainTab('other_rules')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-book-bookmark mr-1"></i>其他規則
                </button>
                <button id="tab-equipmentEnhancement_rules" onclick="switchMainTab('equipmentEnhancement_rules')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-book-bookmark mr-1"></i>裝備強化
                </button>
                <button id="tab-tools" onclick="switchMainTab('tools')" class="main-tab-btn py-2 px-3 rounded-lg text-zinc-400 hover:text-amber-400 transition-all border border-transparent whitespace-nowrap">
                    <i class="fa-solid fa-calculator mr-1"></i>跑團小工具
                </button>
            </nav>
        </div>
            <!-- 全域規則檢索區塊 (建議放在 #rule-subtabs-nav 上方) -->
            <div class="relative mb-4">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-zinc-400 text-sm"></i>
                <input 
                    type="text" 
                    id="global-rule-search" 
                    oninput="handleGlobalRuleSearch(this.value)"
                    placeholder="輸入關鍵字檢索規則（例如：魔動機石、庇護、夢魘、不名譽、威力表、騎乘...）" 
                    class="w-full bg-zinc-900/90 border border-zinc-700/80 focus:border-amber-500 rounded-xl pl-10 pr-20 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none shadow-inner transition-colors"
                >
                <button 
                    id="clear-rule-search-btn" 
                    onclick="clearGlobalRuleSearch()" 
                    class="hidden absolute right-3 text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-zinc-200 px-2 py-1 rounded transition-colors"
                >
                    清除
                </button>
            </div>

            <!-- 即時搜尋結果下拉清單 -->
            <div id="global-search-results" class="hidden absolute z-50 w-full mt-2 bg-zinc-900 border border-amber-500/40 rounded-xl shadow-2xl max-h-96 overflow-y-auto divide-y divide-zinc-800/80">
                <!-- 搜尋結果由 JS 動態渲染 -->
            </div>
        </div>
    </header>

    <!-- 主內容區 Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

        <!-- ==================== TAB 1: 技能檢索介面 ==================== -->
        <section id="sec-bards" class="space-y-6">
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 grid grid-cols-1 md:grid-cols-4 gap-4 shadow-md">
                <div class="md:col-span-2 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-zinc-500"></i>
                    <input type="text" id="bard-search" oninput="filterBardSongs()" placeholder="搜尋技能名稱、日文名、概要或效果..." 
                        class="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-amber-500 text-sm">
                </div>
                <div>
                    <select id="bard-category-filter" onchange="filterBardSongs()" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500 text-sm">
                        <option value="">所有技能分類</option>  
                        <option value="吟遊詩人">吟遊詩人 (咒歌/終律)</option>
                        <option value="魔動機術">魔動機術</option>
                        <option value="操靈魔法">操靈魔法</option>
                        <option value="真語魔法">真語魔法</option>
                        <option value="深智魔法">深智魔法</option>
                        <option value="神聖魔法">神聖魔法</option>
                        <option value="妖精魔法">妖精魔法</option>
                        <option value="賦術">賦術</option>
                        <option value="操氣">操氣 (暗獵者)</option>
                        <option value="森羅魔法">森羅魔法</option>
                        <option value="軍師">軍師 (鼓咆/陣率)</option>
                        <option value="天地使">天地使</option>
                        <option value="奈洛魔法">奈洛魔法</option>
                        <option value="騎藝">騎藝</option>
                        <option value="典籍魔導士">祕奧魔法</option>
                        <option value="練體士">練技</option>
                        <option value="戰鬥特技">戰鬥特技</option>
                    </select>
                </div>
                <div>
                    <select id="bard-level-filter" onchange="filterBardSongs()" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500 text-sm">
                        <option value="">所有等級需求 (Lv 1~15)</option>
                        <option value="1">Lv 1 以下可習得</option>
                        <option value="2">Lv 2 以下可習得</option>
                        <option value="3">Lv 3 以下可習得</option>
                        <option value="4">Lv 4 以下可習得</option>
                        <option value="5">Lv 5 以下可習得</option>
                        <option value="6">Lv 6 以下可習得</option>
                        <option value="7">Lv 7 以下可習得</option>
                        <option value="8">Lv 8 以下可習得</option>
                        <option value="9">Lv 9 以下可習得</option>
                        <option value="10">Lv 10 以下可習得</option>
                        <option value="11">Lv 11 以下可習得</option>
                        <option value="12">Lv 12 以下可習得</option>
                        <option value="13">Lv 13 以下可習得</option>
                        <option value="14">Lv 14 以下可習得</option>
                        <option value="15">Lv 15 以下可習得</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-center text-xs text-zinc-400 px-1">
                <span>顯示結果：<strong id="song-count" class="text-amber-400">0</strong> 筆資料</span>
                <span>經驗點表：<strong>經驗表 A / B</strong></span>
            </div>

            <div id="bard-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <!-- ==================== TAB 2: 道具與裝備檢索介面 ==================== -->
        <section id="sec-items" class="space-y-6 hidden">
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 grid grid-cols-1 md:grid-cols-3 gap-4 shadow-md">
                <div class="md:col-span-2 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-zinc-500"></i>
                    <input type="text" id="item-search" oninput="filterItems()" placeholder="搜尋道具/裝備名稱、日文名、效果、價格或說明..." 
                        class="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-amber-500 text-sm">
                </div>
                <div>
                    <select id="item-category-filter" onchange="filterItems()" class="w-full bg-zinc-800 border border-zinc-700 text-zinc-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500 text-sm">
                        <option value="">所有道具與裝備分類</option>
                        <optgroup label="冒險與通用道具">
                            <option value="一般冒險道具">一般冒險道具</option>
                            <option value="特殊道具">特殊道具</option>
                            <option value="生活與交通工具">生活與交通工具</option>
                            <option value="藥水/練金卡片">藥水/練金卡片</option>
                            <option value="彈藥/消耗品">彈藥/消耗品</option>
                            <option value="樂器/吟遊詩人">樂器/吟遊詩人</option>
                        </optgroup>
                        <optgroup label="武器分類">
                            <option value="武器-劍">武器-劍</option>
                            <option value="武器-斧">武器-斧</option>
                            <option value="武器-槍">武器-槍</option>
                            <option value="武器-鈍器/錘">武器-鈍器/錘</option>
                            <option value="武器-戰錘">武器-戰锤</option>
                            <option value="武器-長杖">武器-長杖</option>
                            <option value="武器-弓">武器-弓</option>
                            <option value="武器-弩">武器-弩</option>
                            <option value="武器-魔導槍">武器-魔導槍</option>
                            <option value="武器-連枷">武器-連枷</option>
                            <option value="武器-格鬥/抓握">武器-格鬥/抓握</option>
                            <option value="武器-投擲">武器-投擲</option>
                        </optgroup>
                        <optgroup label="防具與飾品">
                            <option value="防具-金屬鎧甲">防具-金屬鎧甲</option>
                            <option value="防具-盾牌">防具-盾牌</option>
                            <option value="飾品裝備">飾品裝備</option>
                        </optgroup>
                        <optgroup label="特殊物件與軌跡">
                            <option value="魔像/強化物件">魔像/強化物件</option>
                            <option value="相導具/相動軌跡">相導具/相動軌跡</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-center text-xs text-zinc-400 px-1">
                <span>顯示結果：<strong id="item-count" class="text-amber-400">0</strong> 筆資料</span>
            </div>

            <!-- 道具卡片渲染容器 -->
            <div id="item-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
        <!-- ==================== TAB 3: 技能規則與獨立規則頁面 ==================== -->
        <section id="sec-rules" class="space-y-6 hidden">
            <!-- 技能職業子頁籤 (加上 id="rule-subtabs-nav"，點擊獨立規則時會隱藏) -->
            <div id="rule-subtabs-nav" class="flex overflow-x-auto gap-2 border-b border-zinc-800 pb-3 custom-scrollbar">
                <button onclick="switchRuleSubTab('bard_rules')" id="subtab-bard_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-amber-500/20 text-amber-400 border border-amber-500/30 whitespace-nowrap font-medium">
                    <i class="fa-solid fa-feather mr-1"></i> 吟遊詩人
                </button>
                <button onclick="switchRuleSubTab('magitech_rules')" id="subtab-magitech_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-gears mr-1"></i> 魔動機術
                </button>
                <button onclick="switchRuleSubTab('sorcerer_rules')" id="subtab-sorcerer_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-hand-sparkles mr-1"></i> 操靈魔法
                </button>
                <button onclick="switchRuleSubTab('sorcery_rules')" id="subtab-sorcery_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-scroll mr-1"></i> 真語魔法
                </button>
                <button onclick="switchRuleSubTab('wizard_rules')" id="subtab-wizard_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-hat-wizard mr-1"></i> 深智魔法
                </button>
                <button onclick="switchRuleSubTab('divine_rules')" id="subtab-divine_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-hands-praying mr-1"></i> 神聖魔法
                </button>
                <button onclick="switchRuleSubTab('fairy_rules')" id="subtab-fairy_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-gem mr-1"></i> 妖精魔法
                </button>
                <button onclick="switchRuleSubTab('alchemist_rules')" id="subtab-alchemist_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-layer-group mr-1"></i> 賦術
                </button>
                <button onclick="switchRuleSubTab('bibliomancer_rules')" id="subtab-bibliomancer_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-book-bookmark mr-1"></i> 典籍魔導士
                </button>
                <button onclick="switchRuleSubTab('darkhunter_rules')" id="subtab-darkhunter_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-crosshairs mr-1"></i> 暗獵者
                </button>
                <button onclick="switchRuleSubTab('druid_rules')" id="subtab-druid_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-leaf mr-1"></i> 森羅魔法
                </button>
                <button onclick="switchRuleSubTab('warleader_rules')" id="subtab-warleader_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-bullhorn mr-1"></i> 軍師技能
                </button>
                <button onclick="switchRuleSubTab('geomancer_rules')" id="subtab-geomancer_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-earth-asia mr-1"></i> 天地使技能
                </button>
                <button onclick="switchRuleSubTab('abyssgazer_rules')" id="subtab-abyssgazer_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-eye-low-vision mr-1"></i> 奈洛魔法
                </button>
                <button onclick="switchRuleSubTab('rider_rules')" id="subtab-rider_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-horse mr-1"></i> 騎手規則
                </button>
                <button onclick="switchRuleSubTab('enhancer_rules')" id="subtab-enhancer_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-person-running mr-1"></i> 練體士規則
                </button>
                <button onclick="switchRuleSubTab('battle_dancer_rules')" id="subtab-battle_dancer_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-shoe-prints mr-1"></i> 舞鬥士
                </button>
                <button onclick="switchRuleSubTab('feat_rules')" id="subtab-feat_rules" class="rule-subtab-btn px-3 py-1.5 rounded-lg text-sm bg-zinc-800 text-zinc-400 hover:text-amber-400 whitespace-nowrap transition-all">
                    <i class="fa-solid fa-burst mr-1"></i>戰鬥特技規則
                </button>
            </div>

            <!-- 規則內文動態渲染區 -->
            <div id="rules-container" class="space-y-6"></div>
        </section>

    </main>

    <!-- 頁腳 Footer -->
    <footer class="bg-zinc-950 border-t border-zinc-800 py-4 mt-8 text-center text-xs text-zinc-500">
        <p>SW2.5 規則與資料版權屬於 Group SNE / KADOKAWA 所有。本工具僅供 TRPG 玩家帶團與查閱使用。</p>
    </footer>

    <!-- 主入口 JavaScript -->
    <script type="module" src="./script.js"></script>
</body>
</html>
